<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galéria študijných materiálov</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --page-bg: #07192d;
      --panel-bg: rgba(10, 26, 44, 0.9);
      --panel-edge: #1fa9ff;
      --panel-edge-soft: rgba(31, 169, 255, 0.65);
      --text: #dfeef9;
      --muted: rgba(223, 238, 249, 0.8);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 18px 22px 30px;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 12px 18px;
      color: #edf8ff;
      font-weight: 700;
      font-size: clamp(1.5rem, 2vw, 2rem);
      letter-spacing: 0.02em;
    }

    .topbar .icon-box {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: linear-gradient(135deg, #7ccdfb, #3ec2ff);
      color: #0a1a2d;
      font-size: 12px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(190px, 1fr));
      gap: 22px 28px;
      margin-top: 8px;
    }

    .tile {
      position: relative;
      height: 250px;
      background: rgba(11, 25, 42, 0.92);
      border: 2px solid var(--panel-edge);
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(116, 214, 255, 0.12), 0 0 0 1px rgba(18, 46, 75, 0.75);
      overflow: hidden;
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(10, 22, 35, 0.08);
      pointer-events: none;
    }

    .tile .top-label,
    .tile .bottom-label {
      position: absolute;
      left: 20px;
      color: rgba(220, 240, 255, 0.95);
      font-size: 1.05rem;
      line-height: 1.2;
      z-index: 2;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .tile .top-label {
      top: 18px;
      opacity: 0.9;
    }

    .tile .bottom-label {
      bottom: 16px;
      opacity: 0.95;
    }

    .tile .icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 2.6vw, 3rem);
      color: rgba(255, 255, 255, 0.9);
      z-index: 1;
      opacity: 0.74;
      text-shadow: 0 0 12px rgba(74, 206, 255, 0.35);
    }

    .tile .icon i {
      transform: translateY(10px);
    }

    .server {
      width: 280px;
      height: 220px;
      margin-top: 26px;
      background: rgba(9, 25, 42, 0.92);
      border: 2px solid var(--panel-edge);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(18, 46, 75, 0.75);
      position: relative;
    }

    .server .image {
      height: 166px;
      background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=900&q=80');
      background-size: cover;
      background-position: center;
      filter: saturate(0.85) contrast(1.06) brightness(0.82);
      border-bottom: 2px solid rgba(31, 169, 255, 0.4);
    }

    .server .label {
      position: absolute;
      left: 18px;
      bottom: 12px;
      color: rgba(220, 240, 255, 0.95);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    @media (max-width: 700px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }
    }

    @media (max-width: 480px) {
      body {
        padding-left: 14px;
        padding-right: 14px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .server {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <span class="icon-box"><i class="fa-solid fa-folder"></i></span>
      <span>Galéria študijných materiálov</span>
    </header>

    <main class="gallery" aria-label="Galéria materiálov">
      <div class="tile">
        <div class="top-label">Počítač</div>
        <div class="icon"><i class="fa-solid fa-desktop"></i></div>
        <div class="bottom-label">Počítač</div>
      </div>

      <div class="tile">
        <div class="top-label">WiFi</div>
        <div class="icon"><i class="fa-solid fa-wifi"></i></div>
        <div class="bottom-label">WiFi</div>
      </div>

      <div class="tile">
        <div class="top-label">Sieť</div>
        <div class="icon"><i class="fa-solid fa-network-wired"></i></div>
        <div class="bottom-label">Sieť</div>
      </div>

      <div class="tile">
        <div class="top-label">Počítač</div>
        <div class="icon"><i class="fa-solid fa-desktop"></i></div>
        <div class="bottom-label">Počítač</div>
      </div>

      <div class="tile">
        <div class="top-label">WiFi</div>
        <div class="icon"><i class="fa-solid fa-wifi"></i></div>
        <div class="bottom-label">WiFi</div>
      </div>

      <div class="tile">
        <div class="top-label">Sieť</div>
        <div class="icon"><i class="fa-solid fa-network-wired"></i></div>
        <div class="bottom-label">Sieť</div>
      </div>
    </main>

    <div class="server" aria-label="Server">
      <div class="image"></div>
      <div class="label">Server</div>
    </div>
  </div>
</body>
</html>
